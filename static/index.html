<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Darius — talk once, reach a thousand</title>
  <meta name="description" content="Spawn conversational agents that interview people and pour the answers into a living, queryable spreadsheet.">
  <meta name="theme-color" content="#f7f2e7">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div id="app">
    <div class="boot">
      <img class="boot-mark" src="/icons/logo.svg" alt="" width="72" height="72">
      <div class="boot-word">Darius</div>
      <div class="boot-line" aria-hidden="true"><span></span></div>
      <p>Opening your workspace</p>
    </div>
  </div>
  <div id="toast-zone"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
